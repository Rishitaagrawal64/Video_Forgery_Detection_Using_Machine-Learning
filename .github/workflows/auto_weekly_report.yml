name: Weekly Progress Report Auto-Commit

on:
  schedule:
    # Every Thursday at 11:59 PM IST (18:29 UTC)
    # Cron format: min hour day-of-month month day-of-week (4 = Thursday)
    - cron: '29 18 * * 4'
  workflow_dispatch: # Allows manual trigger anytime from the Actions tab

permissions:
  contents: write

jobs:
  generate-and-commit:
    runs-on: ubuntu-24.04 # pinned to avoid surprises from the ubuntu-latest -> Ubuntu 26 migration
    steps:
      - name: Checkout Repository with Full Git History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PDF & Graph Dependencies
        run: |
          pip install reportlab matplotlib

      - name: Generate Weekly PDF Report
        # generate_report.py already writes the PDF into weekly_reports/
        run: |
          python generate_report.py weekly

      - name: Commit Report to Repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add weekly_reports/

          if git diff --staged --quiet; then
            echo "No new changes or reports to commit."
          else
            git commit -m "docs: archive Form-3 weekly progress report [skip ci]"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi