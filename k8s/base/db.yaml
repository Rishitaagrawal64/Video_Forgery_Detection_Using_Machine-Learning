apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None            # headless: the API reaches PostgreSQL at host "db"
  selector:
    app: db
  ports:
    - name: postgres
      port: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
    spec:
      securityContext:
        fsGroup: 70            # postgres user in the alpine image
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: forgery
            - name: POSTGRES_DB
              value: forgery
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgery-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata   # sub-folder: the volume root contains lost+found
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "forgery", "-d", "forgery"]
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "forgery", "-d", "forgery"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
