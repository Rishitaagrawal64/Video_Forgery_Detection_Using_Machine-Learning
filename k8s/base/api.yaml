apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - name: http
      port: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  # Keep at 1: an uploaded video lives on this pod's local disk, so the follow-up /analyze request must
  # reach the same pod. More replicas need shared storage (ReadWriteMany volume) or object storage first.
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000        # "appuser" in the Dockerfile
        fsGroup: 1000
      initContainers:
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432 -U forgery -d forgery; do echo waiting for db; sleep 2; done"]
          securityContext:
            runAsUser: 70
            allowPrivilegeEscalation: false
      containers:
        - name: api
          image: forgery-api          # real image name and tag are set in each overlay
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: api-config
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: forgery-secrets
                  key: POSTGRES_PASSWORD
            - name: FORGERY_DATABASE_URL     # must come after POSTGRES_PASSWORD (uses $(...) substitution)
              value: postgresql+psycopg://forgery:$(POSTGRES_PASSWORD)@db:5432/forgery
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests: {cpu: 500m, memory: 1Gi}
            limits: {cpu: "2", memory: 3Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /srv/data      # uploads and extracted frames (deleted after processing, NFR-005)
      volumes:
        - name: data
          emptyDir: {}
