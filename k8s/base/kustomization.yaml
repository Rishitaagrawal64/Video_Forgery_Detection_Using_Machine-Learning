apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - db.yaml
  - api.yaml
  - frontend.yaml
  - ingress.yaml
configMapGenerator:
  - name: api-config
    literals:
      - FORGERY_PREDICTOR=heuristic
      - FORGERY_MAX_UPLOAD_MB=50
      - FORGERY_DECISION_THRESHOLD=0.5
      - FORGERY_LOG_LEVEL=INFO
