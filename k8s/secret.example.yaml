# EXAMPLE ONLY - do not commit a real password. Create the secret on the cluster instead:
#   kubectl -n forgery-staging create secret generic forgery-secrets --from-literal=POSTGRES_PASSWORD=<letters-and-digits>
apiVersion: v1
kind: Secret
metadata:
  name: forgery-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: change_me_letters_and_digits_only
