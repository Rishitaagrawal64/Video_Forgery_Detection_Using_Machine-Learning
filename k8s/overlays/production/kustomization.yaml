apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: forgery-production
resources:
  - namespace.yaml
  - ../../base
images:                          # use a fixed version tag (for example a commit SHA), not "main", in production
  - name: forgery-api
    newName: ghcr.io/CHANGE_ME_OWNER/CHANGE_ME_REPO-api
    newTag: main
  - name: forgery-frontend
    newName: ghcr.io/CHANGE_ME_OWNER/CHANGE_ME_REPO-frontend
    newTag: main
patches:
  - target: {kind: StatefulSet, name: db}
    patch: |-
      - op: replace
        path: /spec/volumeClaimTemplates/0/spec/resources/requests/storage
        value: 20Gi
  - target: {kind: Deployment, name: api}
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 4Gi
